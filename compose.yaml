services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: checkers
      POSTGRES_USER: checkers
      POSTGRES_PASSWORD: ${CHECKERS_DATABASE_PASSWORD:?Set CHECKERS_DATABASE_PASSWORD for the local database}
    ports:
      - "127.0.0.1:${CHECKERS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - checkers_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkers -d checkers"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local-postgres
      CHECKERS_DATABASE_URL: jdbc:postgresql://postgres:5432/checkers
      CHECKERS_DATABASE_USER: checkers
      CHECKERS_DATABASE_PASSWORD: ${CHECKERS_DATABASE_PASSWORD:?Set CHECKERS_DATABASE_PASSWORD for the local database}
      CHECKERS_WEBSOCKET_ALLOWED_ORIGINS: ${CHECKERS_WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      CHECKERS_SESSION_SECRET: ${CHECKERS_SESSION_SECRET:?Set a stable random session signing secret}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  checkers_postgres:
