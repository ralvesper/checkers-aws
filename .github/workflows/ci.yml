name: Build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: checkers_test
          POSTGRES_USER: checkers
          POSTGRES_PASSWORD: checkers_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkers -d checkers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: jdbc:postgresql://localhost:5432/checkers_test
      PG_TEST_USER: checkers
      PG_TEST_PASSWORD: checkers_test_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test

