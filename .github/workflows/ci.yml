name: Build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: checkers_test
          POSTGRES_USER: checkers
          POSTGRES_PASSWORD: checkers_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkers -d checkers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: jdbc:postgresql://localhost:5432/checkers_test
      PG_TEST_USER: checkers
      PG_TEST_PASSWORD: checkers_test_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B package
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API for browser tests
        run: java -jar target/checkers-aws-0.1.0-SNAPSHOT.jar > /tmp/checkers-api.log 2>&1 &
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build and start full container stack
        working-directory: .
        env:
          CHECKERS_DATABASE_PASSWORD: ci_container_only
          CHECKERS_POSTGRES_PORT: '5433'
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Test actual container images through Nginx
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8081
        run: npm run test:e2e
      - name: Verify durable state after API restart
        working-directory: .
        env:
          CHECKERS_DATABASE_PASSWORD: ci_container_only
          CHECKERS_POSTGRES_PORT: '5433'
        run: python scripts/smoke-containers.py --restart
      - name: Stop test containers
        if: always()
        working-directory: .
        env:
          CHECKERS_DATABASE_PASSWORD: ci_container_only
          CHECKERS_POSTGRES_PORT: '5433'
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/test-results
            /tmp/checkers-api.log
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.4'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

